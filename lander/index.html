<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Binbin's Travels</title>
    <style>
      html, body {
        margin: 0;
        height: 100%;
        display: grid;
        place-items: center;
        background: #040b18;
        color: #f4d49a;
        font-family: Arial, sans-serif;
      }
      .card {
        text-align: center;
        padding: 32px 48px;
        border: 2px solid rgba(244, 212, 154, 0.4);
        border-radius: 18px;
        background: rgba(8, 18, 30, 0.8);
        box-shadow: 0 0 20px rgba(0, 0, 0, 0.25);
      }
      h1 {
        margin: 0 0 16px;
        font-size: 2.2rem;
        letter-spacing: 0.08em;
      }
      p {
        margin: 0 0 20px;
        color: #dfe7f4;
      }
      a.play-button {
        display: inline-block;
        padding: 14px 28px;
        border-radius: 999px;
        background: #f4d49a;
        color: #111827;
        text-decoration: none;
        font-weight: 700;
        transition: transform 0.15s ease;
      }
      a.play-button:hover {
        transform: translateY(-1px);
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>BINBIN'S TRAVELS</h1>
      <p>A tiny rooftop city platformer.</p>
      <a class="play-button" href="/">Play</a>
    </div>
  </body>
</html>
